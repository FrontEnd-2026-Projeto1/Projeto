<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header da Loja</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            background-color: #0a2d5a;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid #eaeaea;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo h1 {
            font-size: 24px;
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo h1 span {
            color: #3498db; 
        }

        .abas {
            width: 100%;
            display: flex;
            list-style: none;
            background-color: #a6c8cc;
            border-top: 1px solid #ffffff;
            padding: 0 20px;
            overflow-x: auto;
        }

        .aba-nav {
            display: block;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #faf2f2;
            text-decoration: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
        }

        .aba-nav:hover {
            color: #000000;
            background-color: #ebe1e1;
        }

        .aba-nav.active {
            color: #000000;
            border-bottom-color: #000000;
            background-color: #ffffff;
        }

        .content-area {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <h1>Adri<span>Express</span></h1>
            </div>
        </div>

        <ul class="abas">
            <li><a href="../Abas/Index.html" class="aba-nav" id="tab-inicio">Início</a></li>
            <li><a href="../Abas/Produtos.html" class="aba-nav" id="tab-produtos">Produtos</a></li>
            <li><a href="../Abas/Compras.html" class="aba-nav" id="tab-compras">Meus Pedidos</a></li>
            <li><a href="../Abas/Contato.html" class="aba-nav" id="tab-contato">Contato</a></li>
        </ul>
    </header>
</body>
</html>
