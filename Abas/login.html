<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entrar | AdriExpress</title>
        <link rel="stylesheet" href="../CSS/base.css">
        <link rel="stylesheet" href="../CSS/login.css">
    </head>
    <body>
        <header class="cabecalho">
            <div class="cabecalho-principal">
                <a class="marca" href="index.html" aria-label="AdriExpress - início"><span>Adri</span>Express</a>
                <input class="menu" type="checkbox" id="menu">
                <label class="menu-icone" for="menu" aria-label="Abrir ou fechar menu"></label>
                <nav class="navegacao" aria-label="Navegação principal">
                    <a href="index.html">Início</a>
                    <a href="loja.html">Produtos</a>
                    
                    <a href="Contato.html">Contato</a>
                    <a href="cadastro.html">Cadastro</a>
                    <a href="login.html" aria-current="page">Entrar</a>
                    <a href="perfil.html">Perfil</a>
                    <a href="relatorios.html">Administração</a>
                </nav>
            </div>
        </header>
        <main class="pagina pagina-formulario">
            <section class="formulario-cartao formulario-login">
                <p class="sobretitulo">Bem-vindo de volta</p>
                <h1>Entrar na sua conta</h1>
                <p class="texto-ajuda">Acesse seus pedidos e informações.</p>
                <form class="formulario-padrao" id="form-login">
                    <fieldset class="grupo-campos">
                        <legend>Dados de acesso</legend>
                        <label for="login-email">E-mail</label>
                        <input id="login-email" name="email" type="email" required>
                        <label for="login-senha">Senha</label>
                        <input id="login-senha" name="senha" type="password" required>
                    </fieldset>
                    <button class="botao botao-cheio" type="button">Entrar</button>
                </form>
                <p class="alternativa-formulario">Ainda não tem conta? <a href="cadastro.html">Criar cadastro</a></p>
            </section>
        </main>
        <footer class="rodape">
            <a class="marca marca-rodape" href="index.html"><span>Adri</span>Express</a>
            <p>Uma boa descoberta para cada dia.</p> <small>© 2026 AdriExpress. Projeto acadêmico.</small>
        </footer>
    </body>
</html>
